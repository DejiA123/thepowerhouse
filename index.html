<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- PWA Optimized Viewport for Keyboard Support -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>The Power House</title>
  <meta name="description" content="The PowerHouse International Church App - Connect, Grow, Serve" />
  <meta name="author" content="PowerHouse International" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <!-- Preload hero/card images to avoid Safari background-image blanks -->
  <!-- Removed eager preloads to avoid console warnings and wasted bandwidth -->

  <!-- PWA Meta Tags -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Power House">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-orientations" content="portrait">
  <meta name="apple-mobile-web-app-audio-session" content="playback">
  <meta name="apple-mobile-web-app-audio-category" content="playback">
  <meta name="apple-mobile-web-app-audio-mode" content="default">

  <!-- Runtime app config for platforms without env vars (e.g., Lovable free tier) -->
  <script>
    window.__APP_CONFIG__ = window.__APP_CONFIG__ || {};
    // Set your Supabase public storage base URL for audio MP3s here
    // Example: https://<project-ref>.supabase.co/storage/v1/object/public/audio-bible
    window.__APP_CONFIG__.audioCdnBase = "https://swjzhzmhqyvwfwevijja.storage.supabase.co/storage/v1/object/public/audio-bible";
    window.__APP_CONFIG__.mp3Only = true;
  </script>

  <!-- Audio Session Meta Tags for Background Audio (deduplicated) -->
  <!-- iOS/Android capability already declared above; keeping status bar translucent for iOS PWA -->

  <meta property="og:title" content="The Power House" />
  <meta property="og:description" content="The PowerHouse International Church App - Connect, Grow, Serve" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/favicon.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@powerhouse_intl" />
  <meta name="twitter:image" content="/favicon.png" />

  <!-- Fonts load alongside the app instead of holding up the first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap" /></noscript>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>

<body>
  <script>
    // Apply theme background BEFORE React mounts to prevent white flash
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var bg = isDark ? '#0a0a0a' : '#ffffff';
      document.documentElement.style.backgroundColor = bg;
      document.documentElement.classList.add(isDark ? 'dark' : 'light');
    })();
  </script>
  <div id="root"></div>
  <!-- Shown the instant the app opens, until the first screen is ready -->
  <div id="splash" aria-hidden="true">
    <img src="/icons/icon-192.png" alt="" width="88" height="88" />
    <div class="splash-name">The Power House</div>
    <div class="splash-bar"><span></span></div>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #ffffff;
      transition: opacity 0.28s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html.dark #splash { background: #0a0a0a; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(29, 63, 214, 0.18); }
    #splash .splash-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #0f172a; }
    html.dark #splash .splash-name { color: #f1f5f9; }
    #splash .splash-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(29, 63, 214, 0.12); margin-top: 6px; }
    #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #1d3fd6; animation: splash-slide 1.1s ease-in-out infinite; }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
  <script>
    // The app fires "app-ready" once its first screen is on show
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        if (!splash) return;
        var el = splash;
        splash = null;
        el.classList.add('splash-hide');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 320);
      }
      window.addEventListener('app-ready', hide);
      setTimeout(hide, 12000);
    })();
  </script>
  <style>
    /* Prevent blue rubber-band background bleed behind the notch/status area on iOS Safari */
    html,
    body {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background-color: #0a0a0a;
      }
    }

    /* Force dark theme when dark class is applied - slam background to absolute dark */
    html.dark,
    html.dark body,
    html.dark #root {
      background-color: #0a0a0a !important;
    }

    /* Force light theme when light class is applied - strictly white floor */
    html.light,
    html.light body,
    html.light #root {
      background-color: #ffffff !important;
    }

    html,
    body {
      height: 100%;
      min-height: -webkit-fill-available;
      width: 100%;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      /* Prevent selection on UI elements - override in specific components */
    }

    /* Re-enable selection for the root container and children */
    #root {
      -webkit-user-select: text;
      user-select: text;
      height: 100%;
      width: 100%;
      background-color: inherit;
    }

    /* Status bar background styling */
    .status-bar-bg {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
    }

    html.dark .status-bar-bg {
      background-color: #0a0a0a !important;
    }

    html.light .status-bar-bg {
      background-color: #ffffff !important;
    }

    /* PWA Mobile Keyboard Optimizations */
    input,
    textarea,
    select {
      -webkit-appearance: none;
      -webkit-user-select: text;
    }

    /* Ensure inputs are properly sized for mobile keyboards */
    @media screen and (max-width: 768px) {

      input,
      textarea {
        font-size: 16px !important;
        /* Prevents zoom on iOS */
        transform: translateZ(0);
        /* Force hardware acceleration */
      }
    }

    /* Prevent zoom on input focus for iOS */
    @supports (-webkit-touch-callout: none) {

      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    /* Background Audio Optimizations */
    audio {
      -webkit-media-controls: none;
      -webkit-media-controls-panel: none;
      -webkit-media-controls-play-button: none;
      -webkit-media-controls-timeline: none;
      -webkit-media-controls-current-time-display: none;
      -webkit-media-controls-time-remaining-display: none;
      -webkit-media-controls-mute-button: none;
      -webkit-media-controls-volume-slider: none;
      -webkit-media-controls-fullscreen-button: none;
      -webkit-media-controls-overlay-play-button: none;
      -webkit-media-controls-overlay-enclosure: none;
    }

    /* Ensure audio element is hidden but functional */
    audio[hidden] {
      display: none !important;
    }
  </style>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
