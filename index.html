  <script>
    // Apply theme background BEFORE React mounts to prevent white flash
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var bg = isDark ? '#0a0a0a' : '#ffffff';
      document.documentElement.style.backgroundColor = bg;
      document.documentElement.classList.add(isDark ? 'dark' : 'light');
    })();
  </script>
  <div id="root"></div>
  <!-- Shown the instant the app opens, until the first screen is ready -->
  <div id="splash" aria-hidden="true">
    <img src="/icons/icon-192.png" alt="" width="88" height="88" />
    <div class="splash-name">The Power House</div>
    <div class="splash-bar"><span></span></div>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #ffffff;
      transition: opacity 0.28s ease;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html.dark #splash { background: #0a0a0a; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(29, 63, 214, 0.18); }
    #splash .splash-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #0f172a; }
    html.dark #splash .splash-name { color: #f1f5f9; }
    #splash .splash-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(29, 63, 214, 0.12); margin-top: 6px; }
    #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #1d3fd6; animation: splash-slide 1.1s ease-in-out infinite; }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
  <script>
    // The app fires "app-ready" once its first screen is on show
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        if (!splash) return;
        var el = splash;
        splash = null;
        el.classList.add('splash-hide');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 320);
      }
      window.addEventListener('app-ready', hide);
      setTimeout(hide, 12000);
    })();
  </script>
  <style>
    /* Prevent blue rubber-band background bleed behind the notch/status area on iOS Safari */
    html,
    body {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background-color: #0a0a0a;
      }
    }

    /* Force dark theme when dark class is applied - slam background to absolute dark */
    html.dark,
    html.dark body,
    html.dark #root {
      background-color: #0a0a0a !important;
    }

    /* Force light theme when light class is applied - strictly white floor */
    html.light,
    html.light body,
    html.light #root {
      background-color: #ffffff !important;
    }

    html,
    body {
      height: 100%;
      min-height: -webkit-fill-available;
      width: 100%;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      /* Prevent selection on UI elements - override in specific components */
    }

    /* Re-enable selection for the root container and children */
    #root {
      -webkit-user-select: text;
      user-select: text;
      height: 100%;
      width: 100%;
      background-color: inherit;
    }

    /* Status bar background styling */
    .status-bar-bg {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
    }

    html.dark .status-bar-bg {
      background-color: #0a0a0a !important;
    }

    html.light .status-bar-bg {
      background-color: #ffffff !important;
    }

    /* PWA Mobile Keyboard Optimizations */
    input,
    textarea,
    select {
      -webkit-appearance: none;
      -webkit-user-select: text;
    }

    /* Ensure inputs are properly sized for mobile keyboards */
    @media screen and (max-width: 768px) {

      input,
      textarea {
        font-size: 16px !important;
        /* Prevents zoom on iOS */
        transform: translateZ(0);
        /* Force hardware acceleration */
      }
    }

    /* Prevent zoom on input focus for iOS */
    @supports (-webkit-touch-callout: none) {

      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    /* Background Audio Optimizations */
    audio {
      -webkit-media-controls: none;
      -webkit-media-controls-panel: none;
      -webkit-media-controls-play-button: none;
      -webkit-media-controls-timeline: none;
      -webkit-media-controls-current-time-display: none;
      -webkit-media-controls-time-remaining-display: none;
      -webkit-media-controls-mute-button: none;
      -webkit-media-controls-volume-slider: none;
      -webkit-media-controls-fullscreen-button: none;
      -webkit-media-controls-overlay-play-button: none;
      -webkit-media-controls-overlay-enclosure: none;
    }

    /* Ensure audio element is hidden but functional */
    audio[hidden] {
      display: none !important;
    }
  </style>
