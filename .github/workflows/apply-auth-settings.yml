name: Apply sign-in email settings

# Applies supabase/auth-settings.json (the sign-in emails' subjects and
# wording) to the live project through Supabase's Management API
# (PATCH config/auth), so they live in the repository like everything else.
# Only the keys in that file change; nothing else is touched.
#
# Runs when the file changes on main, or by hand (Actions → Apply sign-in
# email settings). Needs the secret SUPABASE_ACCESS_TOKEN. The file is public:
# never put a password in it. A mail server's password goes in the Supabase
# dashboard (Authentication → Emails → SMTP Settings).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/auth-settings.json']

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: swjzhzmhqyvwfwevijja
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::The SUPABASE_ACCESS_TOKEN secret isn't set, so nothing was changed."
            exit 0
          fi
          # Only email subjects and templates belong here
          if jq -e 'keys[] | select(test("^mailer_(subjects|templates)_") | not)' supabase/auth-settings.json > /dev/null; then
            echo "::error::auth-settings.json may only hold email subjects and templates (mailer_subjects_*, mailer_templates_*)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @supabase/auth-settings.json)
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            head -c 1000 /tmp/out.json; echo
            echo "::error::The settings weren't applied."
            exit 1
          fi
          # What the live project now has, for the keys in the file
          jq --slurpfile want supabase/auth-settings.json \
            'with_entries(select(.key as $k | $want[0] | has($k))) | with_entries(.value |= (if type == "string" and length > 80 then .[0:80] + "…" else . end))' /tmp/out.json
