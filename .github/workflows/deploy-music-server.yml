name: Deploy music server

# Puts the church's own ACE-Step music server (music-server/ace_step.py) on Modal's
# GPUs, for Compose a song → "Make the full song". Modal's free plan includes $30 of
# computing a month.
#
# Needs the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (modal.com →
# Settings → API Tokens) and SUPABASE_ACCESS_TOKEN (Database read-write). Without them
# this does nothing and says so.
#
# Each run makes a new server key (never shown), saves it on Modal (secret "ace-step-api")
# and gives the server's address and key to the app through Supabase Vault (platform entry
# 'acestep', read only by the song-writer function), then wakes the server once so the
# models (~15 GB) are downloaded before the first song.
#
# Runs by hand (Actions → Deploy music server → Run workflow) and when music-server/**
# changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['music-server/**', '.github/workflows/deploy-music-server.yml']

concurrency:
  group: deploy-music-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: swjzhzmhqyvwfwevijja
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secrets
        id: secrets
        run: |
          missing=""
          [ -z "$MODAL_TOKEN_ID" ] && missing="$missing MODAL_TOKEN_ID"
          [ -z "$MODAL_TOKEN_SECRET" ] && missing="$missing MODAL_TOKEN_SECRET"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Add the repository secret(s)$missing to deploy the music server."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Install Modal
        if: steps.secrets.outputs.ok == 'true'
        run: pip install --quiet modal

      - name: Make the server key
        if: steps.secrets.outputs.ok == 'true'
        run: |
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "ACE_KEY=$KEY" >> "$GITHUB_ENV"
          modal secret create ace-step-api "ACESTEP_API_KEY=$KEY" --force > /dev/null
          echo "Server key saved on Modal."

      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: modal deploy music-server/ace_step.py

      - name: Give the app the server's address and key
        if: steps.secrets.outputs.ok == 'true'
        run: |
          URL="$(python -c "import modal; print(modal.Function.from_name('church-ace-step', 'server').get_web_url())")"
          SEP="$(python -c "import modal; print(modal.Function.from_name('church-ace-step', 'separate').get_web_url())")"
          SPEAK="$(python -c "import modal; print(modal.Function.from_name('church-ace-step', 'speak').get_web_url())")"
          STUDIO="$(python -c "import modal; print(modal.Function.from_name('church-ace-step', 'studio').get_web_url())")"
          echo "ACE_URL=$URL" >> "$GITHUB_ENV"
          echo "ACE_STUDIO=$STUDIO" >> "$GITHUB_ENV"
          export ACE_URL="$URL" ACE_SEPARATE="$SEP" ACE_SPEAK="$SPEAK" ACE_STUDIO="$STUDIO"
          echo "Server address: $URL"
          echo "Music-only / voices-only address: $SEP"
          echo "Read-aloud voice address: $SPEAK"
          echo "Studio quality server address: $STUDIO"
          python - <<'PY' > body.json
          import json, os
          value = json.dumps({"url": os.environ["ACE_URL"], "key": os.environ["ACE_KEY"], "separate": os.environ["ACE_SEPARATE"], "speak": os.environ["ACE_SPEAK"], "studio": os.environ["ACE_STUDIO"]})
          sql = "select public.put_service_key('00000000-0000-0000-0000-000000000000'::uuid, 'acestep', $v$" + value + "$v$, null)"
          print(json.dumps({"query": sql}))
          PY
          status=$(curl -sS -o out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" --data-binary @body.json)
          rm -f body.json
          if [ "$status" -ge 300 ]; then
            echo "::error::Saving the server's address failed ($status): $(head -c 300 out.json)"
            exit 1
          fi
          echo "The app now knows the music server."

      - name: Wake the server (downloads the models the first time)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          start=$(date +%s)
          code=$(curl -sS -o health.json -w "%{http_code}" --max-time 2400 -H "Authorization: Bearer $ACE_KEY" "$ACE_URL/health" || echo "000")
          echo "Health: $code after $(( $(date +%s) - start ))s: $(head -c 300 health.json 2>/dev/null)"
          if [ "$code" != "200" ]; then
            echo "::warning::The music server didn't answer yet ($code). The first song will wake it."
          fi

      - name: Wake the studio server (downloads its bigger models the first time)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # Asked every 20 s until its models are loaded: a server with no requests goes back
          # to sleep after 3 minutes, which could cut the first download short
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 2400 ]; do
            code=$(curl -sS -o studio.json -w "%{http_code}" --max-time 600 -H "Authorization: Bearer $ACE_KEY" "$ACE_STUDIO/health" || echo "000")
            if [ "$code" = "200" ] && grep -q '"models_initialized": *true' studio.json && grep -q '"llm_initialized": *true' studio.json; then
              echo "Studio server ready after $(( $(date +%s) - start ))s: $(head -c 300 studio.json)"
              exit 0
            fi
            echo "…$(( $(date +%s) - start ))s: $code $(head -c 160 studio.json 2>/dev/null)"
            sleep 20
          done
          echo "::warning::The studio server didn't finish loading in 40 minutes. The first studio song will wake it."
