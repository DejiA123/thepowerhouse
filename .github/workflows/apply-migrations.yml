name: Apply database migrations

# Runs SQL migration files from supabase/migrations on the live database,
# without Lovable, through Supabase's Management API (database/query).
# Needs the repository secret SUPABASE_ACCESS_TOKEN with Database read-write
# (the same token as "Deploy edge functions"). Without it this does nothing and says so.
#
# - Automatically: when NEW migration files reach main, they run in name order.
#   Files that were already there are never run again, nor the copies Lovable
#   commits of migrations it has already run (added by its bot).
# - By hand: Actions → Apply database migrations → Run workflow, with the file
#   names (or "latest" for the newest one).
#
# Each file goes in one request, which Postgres runs as a single transaction
# (so don't put begin/commit or "create index concurrently" in a migration);
# if one fails, the ones after it are not run. Migrations must be safe to run
# twice ("if not exists", "create or replace", "drop … if exists" first).

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'Migration files to run (names in supabase/migrations, separated by spaces), or "latest"'
        required: true
        default: 'latest'
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: swjzhzmhqyvwfwevijja
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add the repository secret SUPABASE_ACCESS_TOKEN (with Database read-write) to apply migrations from GitHub."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out which migrations
        id: which
        if: steps.token.outputs.ok == 'true'
        env:
          REQUESTED: ${{ github.event.inputs.migrations }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" = "latest" ]; then
              list=$(ls supabase/migrations/*.sql | xargs -n1 basename | sort | tail -n 1)
            else
              list="$REQUESTED"
            fi
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse HEAD^1)
            fi
            # Only files ADDED since the last push: old migrations are never run again
            added=$(git diff --diff-filter=A --name-only "$BEFORE" HEAD -- 'supabase/migrations/*.sql' | sort)
            list=""
            for path in $added; do
              # Lovable commits a copy of each migration it has already run (as its bot): skip those
              by=$(git log --diff-filter=A --format='%an %ae' "$BEFORE..HEAD" -- "$path" | tail -n 1)
              if echo "$by" | grep -qiE 'gpt-engineer-app|lovable'; then
                echo "Skipping $(basename "$path"): added by Lovable, which already ran it"
              else
                list="$list $(basename "$path")"
              fi
            done
          fi
          final=""
          for f in $list; do
            if ! echo "$f" | grep -Eq '^[A-Za-z0-9_.-]+\.sql$' || [ ! -f "supabase/migrations/$f" ]; then
              echo "::error::No migration called $f in supabase/migrations"; exit 1
            fi
            final="$final $f"
          done
          echo "Running:${final:- nothing new}"
          echo "list=$final" >> "$GITHUB_OUTPUT"

      - name: Run them
        if: steps.token.outputs.ok == 'true' && steps.which.outputs.list != ''
        run: |
          for f in ${{ steps.which.outputs.list }}; do
            echo "::group::$f"
            jq -Rs '{query: .}' < "supabase/migrations/$f" > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @/tmp/body.json)
            head -c 2000 /tmp/out.json; echo
            echo "::endgroup::"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::$f failed (HTTP $code). Nothing in it was applied, and the migrations after it were not run."
              exit 1
            fi
            echo "Applied $f"
          done
